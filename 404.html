<script type="application/ld+json">{"@context":"https://schema.org","@type":"ProfessionalService","name":"Bright Front Studio","url":"https://brightfrontstudio.com/","email":"info@brightfrontstudio.com","description":"Website design, builds and care plans for Australian small businesses.","areaServed":{"@type":"Country","name":"Australia"},"logo":"https://brightfrontstudio.com/assets/icon-512.png"}</script>
<style>
@font-face{font-family:Archivo;src:url(https://cdn.jsdelivr.net/npm/@fontsource-variable/archivo@5.3.0/files/archivo-latin-standard-normal.woff2) format("woff2");font-weight:100 900;font-stretch:62% 125%;font-display:swap}
:root{--blue:#1B3FD1;--blue-d:#122C9C;--sun:#FFC23D;--paper:#FCFBF8;--ink:#1B1E2B;--sky:#E6ECFF;--muted:#575C70;--line:#E3E1DA}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Archivo,system-ui,sans-serif;font-size:18px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:clip}
a{color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:6px}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
h1,h2,h3{font-stretch:125%;font-weight:800;letter-spacing:-.02em;line-height:1.02;margin:0}
h1{font-size:clamp(38px,4.6vw,66px)}
h2{font-size:clamp(32px,4vw,52px)}
h3{font-size:22px;letter-spacing:-.01em;line-height:1.15}
p{margin:0}
.lede{font-size:20px;color:var(--muted);max-width:34em}
.btn{display:inline-flex;align-items:center;gap:10px;font:inherit;font-weight:700;font-size:17px;text-decoration:none;border-radius:999px;padding:15px 26px;border:2px solid transparent;cursor:pointer;transition:background .2s,color .2s}
.btn-blue{background:var(--blue);color:#fff}.btn-blue:hover{background:var(--blue-d)}
.btn-line{border-color:var(--ink);color:var(--ink);background:transparent}.btn-line:hover{background:var(--ink);color:#fff}

/* header */
.hdr{position:sticky;top:0;z-index:20;background:rgba(252,251,248,.92);backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .2s}
.hdr.s{border-color:var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:28px;height:76px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-stretch:125%;font-weight:800;font-size:21px;letter-spacing:-.02em}
.logo img{width:34px;height:34px}
.hdr nav{display:flex;gap:26px;margin-left:auto}
.hdr nav a{text-decoration:none;font-weight:600;font-size:16px;color:var(--muted)}.hdr nav a:hover{color:var(--ink)}
.hdr .btn{padding:11px 20px;font-size:15px}

/* hero: the shopfront */
.hero{padding:64px 0 96px}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:56px;align-items:center}
.hero p.lede{margin:28px 0 36px}
.hero .ctas{display:flex;gap:14px;flex-wrap:wrap}
.hero .note{margin-top:22px;font-size:15px;color:var(--muted)}
.shop{position:relative;padding-top:30px}
.awning{position:relative;height:74px;margin:0 -18px;transform-origin:top;animation:roll 1s cubic-bezier(.2,.8,.2,1) .15s both;filter:drop-shadow(0 10px 12px rgba(27,30,43,.18))}
.awning::before{content:"";position:absolute;inset:0 0 22px;background:repeating-linear-gradient(90deg,var(--sun) 0 52px,#fff 52px 104px);border-radius:8px 8px 0 0}
.awning::after{content:"";position:absolute;left:0;right:0;bottom:0;height:24px;background:radial-gradient(circle at 26px 0,var(--sun) 25px,transparent 26px) 0 0/104px 24px,radial-gradient(circle at 78px 0,#fff 25px,transparent 26px) 0 0/104px 24px}
@keyframes roll{from{transform:scaleY(0)}}
.rail{position:absolute;top:22px;left:-26px;right:-26px;height:10px;background:var(--ink);border-radius:6px}
.window{background:var(--blue);border-radius:0 0 18px 18px;padding:22px 22px 0;box-shadow:0 30px 60px -30px rgba(27,63,209,.55)}
.sign{display:inline-block;background:var(--paper);color:var(--blue);font-stretch:125%;font-weight:800;font-size:15px;padding:6px 14px;border-radius:6px;margin-bottom:16px}
.screen{background:#fff;border-radius:12px 12px 0 0;overflow:hidden;border:4px solid var(--ink);border-bottom:0}
.bar{display:flex;gap:6px;padding:10px 12px;background:#F2F1EC;border-bottom:1px solid var(--line)}.bar i{width:9px;height:9px;border-radius:50%;background:#D5D3CB}
.mock{padding:26px 26px 30px;display:grid;grid-template-columns:1.1fr .9fr;gap:20px;align-items:center}
.mock b{display:block;font-stretch:125%;font-size:26px;line-height:1.05;letter-spacing:-.02em}
.mock p{font-size:13px;color:var(--muted);margin:10px 0 14px}
.mock .pill{display:inline-block;background:var(--blue);color:#fff;font-size:12px;font-weight:700;padding:7px 14px;border-radius:99px}
.mock .ph{aspect-ratio:4/5;border-radius:10px;background:linear-gradient(160deg,#9DB4FF,#1B3FD1 70%);position:relative;overflow:hidden}
.mock .ph::after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:62%;background:#FFC23D;border-radius:60px 60px 0 0;opacity:.9}
.mock .row{grid-column:1/-1;display:flex;gap:10px}
.mock .row span{flex:1;height:44px;border-radius:8px;background:var(--sky)}
.sill{height:16px;background:var(--ink);border-radius:0 0 10px 10px;margin:0 -10px}
.tag{position:absolute;right:-14px;bottom:56px;background:var(--sun);color:var(--ink);font-weight:800;font-size:14px;padding:10px 14px;border-radius:12px;transform:rotate(4deg);box-shadow:0 10px 24px -10px rgba(27,30,43,.4)}

/* sections */
section{padding:96px 0}
.head{max-width:760px;margin-bottom:48px}.head p{margin-top:18px}
.blue{background:var(--blue);color:#fff}.blue .lede{color:#C9D3FF}
.services{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:2px solid var(--ink)}
.svc{padding:32px 32px 8px 0}.svc+.svc{padding-left:32px;border-left:1px solid var(--line)}
.svc p{color:var(--muted);margin:14px 0 18px}
.svc ul{list-style:none;padding:0;margin:0;display:grid;gap:8px;font-size:16px}
.svc li{padding-left:22px;position:relative}.svc li::before{content:"";position:absolute;left:0;top:.6em;width:10px;height:10px;border-radius:50%;background:var(--sun)}
.svc .from{display:block;margin-top:22px;font-weight:700}

.steps{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:28px;counter-reset:s}
.steps li{counter-increment:s;border-top:2px solid rgba(255,255,255,.35);padding-top:20px}
.steps li::before{content:counter(s);display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--sun);color:var(--ink);font-weight:800;margin-bottom:18px}
.steps p{color:#C9D3FF;margin-top:10px;font-size:16px}
.steps small{display:block;margin-top:12px;font-size:14px;color:#fff;font-weight:700}

.work{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:56px;align-items:center}
.work figure{margin:0;border:4px solid var(--ink);border-radius:16px;overflow:hidden;box-shadow:14px 14px 0 var(--sun)}
.work figure img{display:block;width:100%;height:auto}
.work p{color:var(--muted);margin-top:16px}
.work ul{margin:20px 0 26px;padding-left:20px;color:var(--ink)}

.plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.plan{border:2px solid var(--ink);border-radius:18px;padding:28px;background:#fff;display:flex;flex-direction:column}
.plan.main{background:var(--sky);border-color:var(--blue)}
.plan .amt{font-stretch:125%;font-weight:800;font-size:40px;margin:14px 0 2px;letter-spacing:-.02em}.plan .amt span{font-size:16px;font-stretch:100%;font-weight:600;color:var(--muted)}
.plan p{color:var(--muted);font-size:16px}
.plan ul{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:9px;font-size:16px}
.plan li{padding-left:24px;position:relative}.plan li::before{content:"";position:absolute;left:2px;top:.45em;width:12px;height:7px;border-left:2.5px solid var(--blue);border-bottom:2.5px solid var(--blue);transform:rotate(-45deg)}
.small{font-size:15px;color:var(--muted);margin-top:22px}

.faq{max-width:820px}
.faq details{border-bottom:1px solid var(--line);padding:20px 0}
.faq summary{cursor:pointer;font-weight:700;font-size:19px;list-style:none;display:flex;justify-content:space-between;gap:20px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:26px;line-height:1;color:var(--blue);transition:transform .2s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq details p{color:var(--muted);margin-top:12px;max-width:40em}

.contact{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:56px}
form{display:grid;gap:16px;background:#fff;border:2px solid var(--ink);border-radius:18px;padding:28px}
label{display:grid;gap:6px;font-weight:700;font-size:15px}
input,select,textarea{font:inherit;font-size:16px;font-weight:400;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--sky)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.contact .mail{margin-top:24px;font-weight:700}.contact .mail a{color:var(--blue)}

.sister{background:var(--ink);color:#fff;border-radius:22px;padding:40px;display:flex;gap:32px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.sister p{color:#B9BCCB;margin-top:10px;max-width:36em}
.sister .btn{background:#fff;color:var(--ink)}

footer{padding:40px 0 56px;color:var(--muted);font-size:15px}
footer .wrap{display:flex;gap:20px;justify-content:space-between;flex-wrap:wrap;align-items:center}

@media(max-width:960px){
 .hero .wrap,.work,.contact{grid-template-columns:minmax(0,1fr)}
 .shop{max-width:560px}
 .services,.plans{grid-template-columns:minmax(0,1fr)}
 .svc,.svc+.svc{padding:28px 0;border-left:0;border-bottom:1px solid var(--line)}
 .steps{grid-template-columns:repeat(2,minmax(0,1fr))}
 .hdr nav{display:none}
}
@media(max-width:560px){
 body{font-size:17px}.wrap{padding:0 20px}
 section{padding:72px 0}.hero{padding:36px 0 72px}
 .steps,.two{grid-template-columns:minmax(0,1fr)}
 .awning{margin:0 -8px;height:60px}.rail{left:-12px;right:-12px}
 .mock{grid-template-columns:1fr;padding:20px}.mock .ph{display:none}
 .tag{right:-6px}
 .hdr .btn{padding:9px 16px;font-size:14px}.hdr .wrap{justify-content:space-between}
}
@media(prefers-reduced-motion:reduce){.awning{animation:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="hdr"><div class="wrap"><a class="logo" href="/"><img src="/assets/favicon.svg" alt="" width="34" height="34">Bright Front</a><a class="btn btn-blue" href="/#contact" style="margin-left:auto">Get a quote</a></div></header>
<main><section class="hero"><div class="wrap" style="display:block;max-width:760px">
<h1>This page has closed up shop.</h1>
<p class="lede" style="margin:24px 0 32px">The link may be old or mistyped. Head back to the home page, or tell us what you were looking for.</p>
<div class="ctas" style="display:flex;gap:14px;flex-wrap:wrap"><a class="btn btn-blue" href="/">Go to the home page</a><a class="btn btn-line" href="mailto:info@brightfrontstudio.com">Email us</a></div>
</div></section></main>
</body>
</html>
